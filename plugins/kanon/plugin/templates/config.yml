# kanon configuration. Paths are relative to the repository root.
version: 1

# Where the glossary and the constitution live. Point these at files the
# project already keeps instead of holding a second copy.
glossary: {{GLOSSARY}}
constitution: {{CONSTITUTION}}

# Words and phrases no acceptance criterion may use, in the language the
# criteria are written in. Matched as whole words, in any letter case.
forbidden-words: []

# When the lint starts warning that a capability should be split. The limit of
# 999 IDs per capability is not configurable.
thresholds:
  active-requirements: 150
  counter: 900
