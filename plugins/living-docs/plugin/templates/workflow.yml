# Living-documentation enforcement, installed by `living-docs init`.
#
# The way to invoke each CLI is a parameter of whoever installs: `--invoke` and
# `--invoke-ownership` choose how each CLI is called in this CI.
#
# This file is yours: `init` only creates it when it does not exist, and never
# rewrites it.
name: living-docs

on:
  push:
  pull_request:

jobs:
  living-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR diff compares <base>...HEAD, and a shallow clone lacks the base.
          fetch-depth: 0

      - name: Owner, lifecycle and generated artifact
        run: {{INVOKE_OWNERSHIP}} validate

      - name: Living documentation — state of the tree
        run: {{INVOKE}} validate
{{WORKFLOW_STEPS}}
