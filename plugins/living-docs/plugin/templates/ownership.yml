# Owner, lifecycle and trigger of each path in this repository. Hooks and
# checks know no path — they read from here. The ownership core reads the
# schema; the `living-docs:` block belongs to living documentation.
version: 2
plugins: [living-docs]

living-docs:
  stale-after-months: 6
  # The written form of an ID in this project. Identity does NOT depend on it:
  # the same prefix with the same number is the same item, with or without a
  # separator and with any number of leading zeros. Change this to adopt a
  # repository whose IDs are already written another way — never renumber the
  # repository to fit the pattern.
  id-format:
    separator: "{{ID_SEPARATOR}}"
    padding: {{ID_PADDING}}

owned:
  # Artifact: an entry with `living-docs.id-prefix`. ID family and lifecycle.
  - path: {{ADR_PATH}}
    owner: "{{OWNER}}"
    skill: decision-recorder
    states: [draft, accepted, superseded]
    living-docs:
      id-prefix: ADR
      append-only: true
      mutable-fields: [status, superseded-by, last-reviewed]

  - path: {{DA_PATH}}
    owner: "{{OWNER}}"
    skill: decision-recorder
    states: [open, resolved, dropped]
    format: { collection: table, key: ID, state-field: Status }
    living-docs:
      id-prefix: DA

  - path: {{TDR_PATH}}
    owner: "{{OWNER}}"
    skill: decision-recorder
    states: [open, paid, accepted-permanently]
    living-docs:
      id-prefix: TDR
      append-only: true
      mutable-fields: [status, last-reviewed]
{{REQUIREMENTS_BLOCK}}{{RELEASES_BLOCK}}
{{DOCUMENTS_BLOCK}}
  # What `init` creates that is not documentation: it has an owner and no block.
  - path: CODEOWNERS
    owner: "{{OWNER}}"
  - path: .github/workflows/living-docs.yml
    owner: "{{OWNER}}"

# `ownership validate` requires an owner for EVERY file in the repository, not
# only for documentation. Declare your code under `owned` (without a
# `living-docs:` block) or take it out of governance here. init does not invent
# these paths. Example:
#
# owned:
#   - path: src/
#     owner: "@time"
ignore: ["node_modules/**", "**/node_modules/**"]

generated: []
# Generated artifact: editing it by hand is denied, and `ownership validate`
# compares the versioned file with the generator output.
#
# The `command` PRINTS the expected content to standard output and writes NO
# file — a check that rewrites what it is checking erases the evidence the
# moment it reports it. A generator that only knows how to write a file gets a
# wrapper: generate into a temporary directory and print the result.
#
# init does not invent a generator, for the same reason it does not invent
# `watches`. Declare yours. Example:
#
# generated:
#   - path: docs/contracts/openapi.gen.yaml
#     command: "node tools/gen-openapi.js"

# Code → owning doc: reminded after the edit, asked before the commit and
# enforced on the PR diff. Fill in with the paths of YOUR code — init does not
# invent a link, because a link nobody recognizes teaches people to ignore the
# reminder. The rule that points at the CHANGELOG with `consumer-visible: true`
# says which paths are visible to whoever consumes. Example:
#
# watches:
#   - code: "src/domain/**"
#     doc: docs/requirements/rules.md
#     reason: "new behavior needs a rule with an ID before the code"
#   - code: "src/api/**"
#     doc: CHANGELOG.md
#     consumer-visible: true
#     reason: "a consumer-visible change is born with its entry in the same PR"
watches: []
