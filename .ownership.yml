# Owner, lifecycle and trigger of each path in this repository. Hooks and
# checks know no path: they read from here. The core (`ownership`) reads the
# schema; the `living-docs:` block belongs to the living-documentation plugin,
# opaque to the core. Origin of the rule: ADR-0020, ADR-0028 and ADR-0029.
version: 2
plugins: [living-docs]

living-docs:
  stale-after-months: 6

# Each plugin project declares its own paths (ADR-0036).
include:
  - plugins/ownership/
  - plugins/living-docs/

owned:
  # --- Artifacts: an entry with `living-docs.id-prefix`. ID family and lifecycle.
  - path: docs/decisions/adr/
    owner: '@esliph/engineering'
    skill: decision-recorder
    states: [draft, accepted, superseded]
    living-docs:
      id-prefix: ADR
      append-only: true
      mutable-fields: [status, superseded-by, last-reviewed]

  - path: docs/open-decisions.md
    owner: '@esliph/engineering'
    skill: decision-recorder
    states: [open, resolved, dropped]
    format: { collection: table, key: ID, state-field: Status }
    living-docs:
      id-prefix: DA

  - path: docs/requirements/rules.md
    owner: '@esliph/engineering'
    skill: requirements-keeper
    states: [draft, active, revoked]
    format: { collection: sections, key: first-token }
    living-docs:
      id-prefix: RN
      cited-by: ['.github/scripts/**']

  # --- Documents: a `living-docs:` block without `id-prefix` (ADR-0008, ADR-0029).
  # `role` is a closed vocabulary; `audience: external` marks text for readers
  # from the outside, which cites no artifact ID.
  - path: .ownership.yml
    owner: '@esliph/engineering'
    skill: living-docs-bootstrap
    living-docs: {}
  - path: docs/ids-retired.txt
    owner: '@esliph/engineering'
    skill: living-docs-bootstrap
    living-docs: {}
  - path: CONTRIBUTING.md
    owner: '@esliph/engineering'
    skill: working-agreements-keeper
    living-docs: {}
  - path: docs/definition-of-done.md
    owner: '@esliph/engineering'
    skill: working-agreements-keeper
    living-docs: { role: definition-of-done }
  - path: CLAUDE.md
    owner: '@esliph/engineering'
    skill: working-agreements-keeper
    living-docs: { role: agent-contract }
  - path: CHANGELOG.md
    owner: '@esliph/engineering'
    skill: release-historian
    living-docs: { audience: external }
  # No owning skill, and that is information: plan, spec and README have an owner
  # and no keeper. They stay outside the duplication corpus of the agent contract
  # (ADR-0009).
  - path: docs/superpowers/
    owner: '@esliph/engineering'
    living-docs: {}
  - path: README.md
    owner: '@esliph/engineering'
    living-docs: { audience: external }

  # --- Owner only: outside living documentation. `ownership/owner-coverage`
  # requires an owner for every file in the repository, not only for documentation.
  - path: .github/
    owner: '@esliph/engineering'
  - path: .claude-plugin/
    owner: '@esliph/engineering'
  - path: CODEOWNERS
    owner: '@esliph/engineering'
  - path: .gitattributes
    owner: '@esliph/engineering'
  - path: .gitignore
    owner: '@esliph/engineering'
  - path: .prettierignore
    owner: '@esliph/engineering'
  - path: .prettierrc
    owner: '@esliph/engineering'
  - path: .editorconfig
    owner: '@esliph/engineering'
  # Vendored from https://github.com/esliph/spur at tag v0.3.1. Replaced whole
  # from another tag, never edited by hand (ADR-0039).
  - path: spur
    owner: '@esliph/engineering'

# The core scans the file system, not the git index: what exists only in the
# checkout of whoever runs it (worktrees, local session state) stays out.
ignore:
  - 'node_modules/**'
  - '**/node_modules/**'
  - '.worktrees/**'
  - '.claude/**'
  - '.superpowers/**'

# Code → owning doc. The reminder on edit, the question at commit and the
# enforcement on the PR diff read from here. `consumer-visible: true` is the
# only list of paths visible to whoever consumes (ADR-0020).
watches:
  - code: '.github/scripts/**'
    doc: docs/requirements/rules.md
    reason: 'a marketplace check is an executable rule — the RN comes first, and it is what the script verifies'

  - code: '.github/workflows/**'
    doc: docs/definition-of-done.md
    reason: "the last line of the Definition of Done names what the workflow runs — changing the workflow changes what 'done' means"

  - code: '.github/workflows/**'
    doc: CHANGELOG.md
    consumer-visible: true
    reason: 'the enforcement is literally what the consumer installs'
