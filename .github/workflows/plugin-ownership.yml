name: plugin-ownership

on:
  push:
    paths: &paths
      - 'plugins/ownership/**'
      - '.github/workflows/plugin-ownership.yml'
      # The runner every step goes through (ADR-0039).
      - 'spur'
  pull_request:
    paths: *paths

defaults:
  run:
    working-directory: plugins/ownership

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor is `engines.node` in package.json (RNF-0002).
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/ownership/package-lock.json

      - name: Install dependencies
        run: ../../spur install

      - name: Tests
        run: ../../spur test

      - name: Type-check
        run: ../../spur typecheck

      - name: Lint
        run: ../../spur lint-check
