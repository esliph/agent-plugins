name: wrapper-docker

# A file separate from living-docs.yml on purpose: the GitHub Actions `paths`
# filter is per workflow and not per job, and conditioning a job inside the
# existing workflow would require a third-party action for nothing (ADR-0016).
#
# The effect on an ordinary PR is zero: no image build, no extra minute. The
# containerized path is only exercised when someone touches what can break
# it (RNF-0006).
on:
  push:
    paths: &wrapper-paths
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/*/package-lock.json'
      - '.github/workflows/wrapper-docker.yml'
  pull_request:
    paths: *wrapper-paths

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The container runs as `node` (uid 1000), and the runner's checkout belongs
      # to another uid. Reading is enough for almost everything, but the packaging test
      # writes `dist/` and the tarball inside the package — without this the `tsc` of
      # prepack dies with EACCES.
      - name: Hand the checkout to the container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      # The first invocation of bin/dev would bring the container up by itself (E-2). Bringing it up
      # here, in its own step, keeps build time attributable: an image failure
      # does not disguise itself as a test failure.
      - name: Start the container
        run: docker compose up -d

      # Through the wrapper, what the host already runs. Neither command is written
      # inside bin/dev — that is the parity RNF-0006 states.
      - name: Tests, through the wrapper
        run: bin/dev npm test

      - name: CI-1 to CI-4, CI-7, CI-8 and CI-10 — living documentation, through the wrapper
        run: bin/dev node --conditions=development packages/living-docs/src/cli/index.ts validate
