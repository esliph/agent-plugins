name: living-docs

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI-6 compara <base>...HEAD; um clone raso não tem a base (ADR-0006).
          fetch-depth: 0

      - name: Construir a imagem
        run: docker compose build

      - name: Instalar dependências
        run: docker compose run --rm toolkit npm ci

      - name: Testes
        run: docker compose run --rm toolkit npm test

      - name: Type-check
        run: docker compose run --rm toolkit npm run typecheck

      - name: CI-1 a CI-4, CI-7 e CI-8 — documentação viva
        run: >
          docker compose run --rm -w /workspace toolkit
          node /opt/living-docs/src/cli/index.ts validate

      # A metade de CI-7 que lê o diff só existe com uma base (ADR-0010). Em
      # `push` não há base, e inventar uma produziria achado sobre mudança que
      # não é desta branch.
      - name: CI-7 — vínculo código→doc no diff do PR
        if: github.event_name == 'pull_request'
        run: >
          docker compose run --rm -w /workspace toolkit
          node /opt/living-docs/src/cli/index.ts validate
          --base ${{ github.event.pull_request.base.sha }}

      - name: CI-5 — deriva de contrato gerado
        run: >
          docker compose run --rm -w /workspace toolkit
          node /opt/living-docs/src/cli/index.ts drift

      - name: CI-6 — entrada de CHANGELOG
        if: github.event_name == 'pull_request'
        run: >
          docker compose run --rm -w /workspace toolkit
          node /opt/living-docs/src/cli/index.ts changelog
          --base ${{ github.event.pull_request.base.sha }}
