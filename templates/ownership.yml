# O único arquivo específico deste projeto. Hooks e checks não conhecem
# caminho nenhum — leem daqui. Regra de origem: LIVING-DOCUMENTATION-TOOLKIT.md §3.
version: 1
stale-after-months: 6

artifacts:
  - id-prefix: ADR
    path: {{ADR_PATH}}
    owner: "{{OWNER}}"
    skill: decision-recorder
    append-only: true
    mutable-fields: [status, superseded-by, last-reviewed]

  - id-prefix: DA
    path: {{DA_PATH}}
    owner: "{{OWNER}}"
    skill: decision-recorder
    collection: table
    # A tabela é lida por gente, em português; o check pergunta pelo nome
    # canônico. O mapeamento mora aqui porque é a única coisa específica do
    # projeto (spec §3).
    field-map:
      resolved-by: "Resolvida por"

  - id-prefix: TDR
    path: {{TDR_PATH}}
    owner: "{{OWNER}}"
    skill: decision-recorder
    append-only: true
    mutable-fields: [status, last-reviewed]
{{REQUIREMENTS_BLOCK}}
generated: []

# Mecanismo 1: código → doc dono. HK-4 lembra depois da edição, HK-5 pergunta
# antes do commit. Na Fase 7, CI-7 lê daqui também. Preencha com os caminhos do
# SEU código — o init não inventa vínculo, porque vínculo que ninguém reconhece
# ensina a ignorar o lembrete. Exemplo:
#
# watches:
#   - code: "src/domain/**"
#     doc: docs/requirements/rules.md
#     reason: "comportamento novo exige regra com ID antes do código"
watches: []

consumer-visible-paths: []
