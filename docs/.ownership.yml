# O único arquivo específico deste projeto. Hooks e checks não conhecem
# caminho nenhum — leem daqui. Regra de origem: LIVING-DOCUMENTATION-TOOLKIT.md §3.
version: 1
stale-after-months: 6

artifacts:
  - id-prefix: ADR
    path: docs/decisions/adr/
    owner: "@dan"
    skill: decision-recorder
    append-only: true
    mutable-fields: [status, superseded-by, last-reviewed]

  - id-prefix: DA
    path: docs/open-decisions.md
    owner: "@dan"
    skill: decision-recorder
    collection: table
    # A tabela é lida por gente, em português; o check pergunta pelo nome
    # canônico. O mapeamento mora aqui porque é a única coisa específica do
    # projeto (spec §3).
    field-map:
      resolved-by: "Resolvida por"

  - id-prefix: TDR
    path: docs/decisions/debt/
    owner: "@dan"
    skill: decision-recorder
    append-only: true
    mutable-fields: [status, last-reviewed]

  - id-prefix: RF
    path: docs/requirements/functional.md
    owner: "@dan"
    skill: requirements-keeper
    collection: sections
    cited-by: ["test/**"]

  - id-prefix: RNF
    path: docs/requirements/non-functional.md
    owner: "@dan"
    skill: requirements-keeper
    collection: sections
    cited-by: ["test/**"]

  - id-prefix: RN
    path: docs/requirements/rules.md
    owner: "@dan"
    skill: requirements-keeper
    collection: sections
    cited-by: ["test/**", "src/**"]

  - id-prefix: REL
    path: docs/releases/
    owner: "@dan"
    skill: release-historian
    # Release note publicada é congelada por HK-1 (spec §5, SK-7, regra 4).
    # É por isso que REL tem família de IDs e CHANGELOG.md não: HK-1 só
    # congela caminho que `findArtifactRule` resolve.
    append-only: true
    mutable-fields: [status, last-reviewed]

generated:
  # O comando IMPRIME o conteúdo esperado na saída padrão e não escreve arquivo
  # nenhum: um check que reescreve o que está checando apaga a evidência no
  # mesmo instante em que a reporta (ADR-0005). HK-2 bloqueia editar `path` à
  # mão; CI-5 (`living-docs drift`) compara.
  - path: docs/contracts/checks.gen.md
    command: node /opt/living-docs/src/tools/gen-checks.ts

# Mecanismo 1: código → doc dono. HK-4 lembra depois da edição, HK-5 pergunta
# antes do commit. Na Fase 7, CI-7 lê daqui também.
watches:
  - code: "src/checks/**"
    doc: docs/requirements/rules.md
    reason: "check é regra executável — a RN vem antes, e é ela que o check verifica"

  - code: "src/checks/catalog.ts"
    doc: docs/contracts/checks.gen.md
    reason: "o contrato público dos checks deriva do CHECK_CATALOG — regerar faz parte da mudança, e editar à mão é bloqueado por HK-2. Skill dona: contract-keeper"

  - code: "src/hooks/**"
    doc: docs/requirements/rules.md
    reason: "hook bloqueia ou pergunta em nome de uma regra; sem RN citada, o bloqueio não tem origem"

  - code: "src/cli/**"
    doc: docs/requirements/functional.md
    reason: "o que o comando faz de observável é RF, não detalhe de implementação"

  - code: "src/core/**"
    doc: docs/requirements/non-functional.md
    reason: "as duas raízes são propriedade do sistema (ADR-0003), não comportamento de comando"

  - code: "plugin/skills/**"
    doc: CONTRIBUTING.md
    reason: "skill nova ou alterada muda como se trabalha aqui"

  # CI-6 (mecanismo 1 na fronteira com quem consome). Os `code` daqui e a lista
  # `consumer-visible-paths` abaixo são o mesmo conjunto de propósito, e
  # test/docs/release-history.test.ts impede que derivem: são dois momentos —
  # o lembrete na edição e a barreira no PR.
  - code: "src/cli/**"
    doc: CHANGELOG.md
    consumer-visible: true
    reason: "subcomando, opção e código de saída são contrato público (docs/contracts/versioning-policy.md)"

  - code: "src/checks/catalog.ts"
    doc: CHANGELOG.md
    consumer-visible: true
    reason: "os IDs dos checks são públicos e não mudam de significado"

  - code: "src/config/ownership.ts"
    doc: CHANGELOG.md
    consumer-visible: true
    reason: "o esquema do .ownership.yml com version 1 é contrato de quem instala"

  - code: "plugin/**"
    doc: CHANGELOG.md
    consumer-visible: true
    reason: "IDs de skill, hook e comando são públicos"

  - code: "templates/**"
    doc: CHANGELOG.md
    consumer-visible: true
    reason: "é o que `init` escreve no repositório de quem instala"

  - code: "bin/living-docs"
    doc: CHANGELOG.md
    consumer-visible: true
    reason: "a ponte host→container é como o toolkit é invocado"

consumer-visible-paths:
  - "src/cli/**"
  - "src/checks/catalog.ts"
  - "src/config/ownership.ts"
  - "plugin/**"
  - "templates/**"
  - "bin/living-docs"
