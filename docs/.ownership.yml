# O único arquivo específico deste projeto. Hooks e checks não conhecem
# caminho nenhum — leem daqui. Regra de origem: LIVING-DOCUMENTATION-TOOLKIT.md §3.
version: 1
stale-after-months: 6

artifacts:
  - id-prefix: ADR
    path: docs/decisions/adr/
    owner: "@dan"
    skill: decision-recorder
    append-only: true
    mutable-fields: [status, superseded-by, last-reviewed]

  - id-prefix: DA
    path: docs/open-decisions.md
    owner: "@dan"
    skill: decision-recorder
    collection: table
    # A tabela é lida por gente, em português; o check pergunta pelo nome
    # canônico. O mapeamento mora aqui porque é a única coisa específica do
    # projeto (spec §3).
    field-map:
      resolved-by: "Resolvida por"

  - id-prefix: TDR
    path: docs/decisions/debt/
    owner: "@dan"
    skill: decision-recorder
    append-only: true
    mutable-fields: [status, last-reviewed]

  - id-prefix: RF
    path: docs/requirements/functional.md
    owner: "@dan"
    skill: requirements-keeper
    collection: sections
    cited-by: ["test/**"]

  - id-prefix: RNF
    path: docs/requirements/non-functional.md
    owner: "@dan"
    skill: requirements-keeper
    collection: sections
    cited-by: ["test/**"]

  - id-prefix: RN
    path: docs/requirements/rules.md
    owner: "@dan"
    skill: requirements-keeper
    collection: sections
    cited-by: ["test/**", "src/**"]

generated: []

# Fases 3+ preenchem `watches` (código → doc dono). Vazio nas Fases 0–1.
watches: []

consumer-visible-paths: []
